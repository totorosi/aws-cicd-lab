# 정적 사이트를 도커 이미지로 빌드해서 EC2 의 컨테이너로 배포한다.
#
#   [러너] docker build → docker save → tar
#        → S3 임시 경로 업로드
#        → SSM RunShellScript
#   [EC2] aws s3 cp → docker load → docker run
#
# 레지스트리(ECR/Docker Hub)를 거치지 않고 tar 파일로 이미지를 전달하는 방식이다.

name: Deploy Static Website with Docker

# ----------------------------------------------------------------------------
# 트리거
# ----------------------------------------------------------------------------
on:
  pull_request:
    paths:
      - "site/**"
      - "deploy/Dockerfile"
      - ".github/workflows/docker.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "deploy/Dockerfile"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

# ----------------------------------------------------------------------------
# 공통 설정
# ----------------------------------------------------------------------------
env:
  AWS_REGION: sa-east-1

  # 이미지 tar 을 잠시 올려두는 버킷. 배포가 끝나면 해당 prefix 를 지운다.
  S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}

  # 배포 대상 EC2. 인스턴스를 다시 만들면 시크릿 값을 갱신한다.
  SSM_INSTANCE_ID: ${{ secrets.SSM_INSTANCE_ID }}

  # 이미지 이름. 태그로는 커밋 SHA 를 쓴다.
  IMAGE_NAME: static-site

  # 컨테이너가 호스트에서 점유할 포트.
  # 호스트 nginx 가 80 을 쓰고 있어 8080 으로 띄운다.
  HOST_PORT: "8080"

# 동시에 여러 배포가 실행되어 컨테이너가 꼬이는 것을 방지
concurrency:
  group: docker-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # --------------------------------------------------------------------------
  # 1) 이미지를 빌드해서 artifact 로 넘긴다. PR 에서는 여기까지만 돈다.
  # --------------------------------------------------------------------------
  build-and-preview:
    name: Build Docker image
    runs-on: ubuntu-latest

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # 베이스 이미지의 익명 pull 횟수 제한을 피하기 위한 로그인.
      # 시크릿을 등록하지 않았다면 이 스텝은 건너뛰고 익명으로 pull 한다.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build --file deploy/Dockerfile --tag "${IMAGE_NAME}:${GITHUB_SHA}" .

      - name: Export Docker image
        run: docker save "${IMAGE_NAME}:${GITHUB_SHA}" --output site-image.tar

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const body = `#### Docker Deployment Preview \`Success\`

            Docker 이미지 빌드가 성공적으로 완료되었습니다.
            \`main\` 브랜치 머지 시 SSM을 통해 EC2 컨테이너로 자동 배포됩니다.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v7
        with:
          name: site-image
          path: site-image.tar
          retention-days: 5

  # --------------------------------------------------------------------------
  # 2) main 에 push 됐을 때만 실제 배포한다.
  # --------------------------------------------------------------------------
  deploy:
    name: Deploy with SSM
    needs: build-and-preview
    # 배포는 저장소 변수 DEPLOY_ENABLED 가 'true' 일 때만 돈다.
    # 값이 없으면 이 job 은 실패가 아니라 '건너뜀'으로 처리된다.
    # (secrets 는 job 레벨 if 에서 쓸 수 없어 vars 로 게이트한다)
    if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    env:
      S3_PREFIX: docker-deploy/${{ github.sha }}

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v7
        with:
          name: site-image

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload Docker image to temporary S3 path
        run: |
          aws s3 cp site-image.tar "s3://${S3_BUCKET_NAME}/${S3_PREFIX}/site-image.tar"

      - name: Deploy container through SSM
        env:
          IMAGE_URI: s3://${{ env.S3_BUCKET_NAME }}/${{ env.S3_PREFIX }}/site-image.tar
        run: |
          set -euo pipefail

          # 인스턴스에서 실행할 스크립트.
          # 한 줄짜리 JSON 으로 욱여넣지 않고 그대로 읽히도록 파일로 만든다.
          # 러너의 셸이 ${...} 를 먼저 치환한 뒤 EC2 로 전달된다.
          cat > remote-deploy.sh <<EOF
          set -e
          aws s3 cp ${IMAGE_URI} /tmp/site-image.tar
          docker load --input /tmp/site-image.tar
          docker rm --force ${IMAGE_NAME} || true
          docker run --detach --name ${IMAGE_NAME} --restart unless-stopped --publish ${HOST_PORT}:80 ${IMAGE_NAME}:${GITHUB_SHA}
          rm -f /tmp/site-image.tar
          docker image prune --all --force
          EOF

          echo "----- EC2 에서 실행될 스크립트 -----"
          cat remote-deploy.sh
          echo "-----------------------------------"

          # jq -Rs 로 스크립트 전체를 JSON 문자열 하나로 감싼다.
          command_id=$(aws ssm send-command \
            --instance-ids "${SSM_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Docker image ${GITHUB_REPOSITORY}@${GITHUB_SHA}" \
            --parameters "$(jq -Rs '{commands: [.]}' < remote-deploy.sh)" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: ${command_id}"

          # send-command 직후에는 invocation 이 아직 등록되지 않아
          # wait 가 InvocationDoesNotExist 로 즉시 실패할 수 있다.
          sleep 5

          wait_status=0
          aws ssm wait command-executed \
            --command-id "${command_id}" \
            --instance-id "${SSM_INSTANCE_ID}" || wait_status=$?

          # 성공/실패와 무관하게 인스턴스 쪽 출력을 로그에 남긴다.
          invocation=$(aws ssm get-command-invocation \
            --command-id "${command_id}" \
            --instance-id "${SSM_INSTANCE_ID}" \
            --output json)

          echo "Status: $(jq -r '.Status' <<<"${invocation}")"
          echo "----- stdout -----"
          jq -r '.StandardOutputContent' <<<"${invocation}"
          echo "----- stderr -----"
          jq -r '.StandardErrorContent' <<<"${invocation}"

          exit "${wait_status}"

      # 배포 성공 여부와 관계없이 임시 이미지를 지운다.
      - name: Remove temporary image
        if: always()
        run: |
          aws s3 rm "s3://${S3_BUCKET_NAME}/${S3_PREFIX}/" --recursive
