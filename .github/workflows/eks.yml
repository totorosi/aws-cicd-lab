# 정적 사이트를 EKS 에 배포한다.
#
#   1. 이미지 빌드 및 ECR 푸시
#   2. 쿠버네티스 파일의 이미지 태그를 현재 커밋 SHA 로 갱신하고 git push
#   3. 클러스터에 반영
#
# ArgoCD 를 붙이면 3번을 지운다. 2번까지가 CI, 반영은 ArgoCD 가 맡는다.

name: Deploy Static Website to EKS

on:
  push:
    branches: [main]
    paths:
      - "nginx/**"
      - "docker/Dockerfile"
      - "docker/k8s/static-site.yaml"
      - ".github/workflows/eks.yml"
  workflow_dispatch:

env:
  AWS_REGION: sa-east-1
  REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.sa-east-1.amazonaws.com
  REPOSITORY: nginx
  # 태그로 커밋 SHA 를 쓴다. latest 를 재사용하면 파일이 안 바뀌어 반영되지 않는다.
  TAG: ${{ github.sha }}
  CLUSTER: ${{ vars.EKS_CLUSTER_NAME }}

concurrency:
  group: eks-deploy
  cancel-in-progress: true

permissions:
  # 태그를 고쳐 되밀어야 하므로 write 가 필요하다.
  contents: write

jobs:
  deploy:
    name: Deploy to EKS
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-kubectl@v4

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 1. 이미지 빌드 및 푸시
      - name: Build and push
        run: |
          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login --username AWS --password-stdin "${REGISTRY}"

          # 컨텍스트는 저장소 루트다. COPY ./nginx/html 이 루트 기준으로 풀린다.
          docker build --file docker/Dockerfile --tag "${REGISTRY}/${REPOSITORY}:${TAG}" .
          docker push "${REGISTRY}/${REPOSITORY}:${TAG}"

      # 2. 매니페스트의 이미지 태그 갱신 및 커밋
      - name: Update the image tag
        run: |
          sed -i \
            -e "s|^    newName: .*|    newName: ${REGISTRY}/${REPOSITORY}|" \
            -e "s|^    newTag: .*|    newTag: ${TAG}|" \
            docker/k8s/kustomization.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: bump image to ${TAG} [skip ci]"
          git push

      # 3. 클러스터에 반영 (ArgoCD 를 붙이면 이 스텝을 지운다)
      - name: Deploy
        run: |
          aws eks update-kubeconfig --region "${AWS_REGION}" --name "${CLUSTER}"

          kubectl apply -k docker/k8s
          kubectl -n static-site rollout status deployment/static-site --timeout=180s
