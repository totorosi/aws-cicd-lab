# 정적 사이트를 S3 버킷에 동기화해서 배포한다.
#
#   [러너] site/ → aws s3 sync --delete
#   [AWS] S3 가 직접 서빙 (정적 웹사이트 호스팅 또는 CloudFront 오리진)
#
# 서버도 컨테이너도 없는 가장 단순한 방식이다.
# 사이트가 순수 HTML 이라 별도 빌드 단계가 없다.

name: Deploy Static Website to S3

# ----------------------------------------------------------------------------
# 트리거
# ----------------------------------------------------------------------------
on:
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/s3.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/s3.yml"
  workflow_dispatch:

# ----------------------------------------------------------------------------
# 공통 설정
# ----------------------------------------------------------------------------
env:
  AWS_REGION: sa-east-1
  S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}

  # 버킷에 올릴 디렉토리
  BUILD_DIR: site

# 동시에 여러 배포가 실행되어 S3 파일이 꼬이는 것을 방지
concurrency:
  group: s3-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # --------------------------------------------------------------------------
  # 1) 올릴 파일을 artifact 로 넘긴다. PR 에서는 여기까지만 돈다.
  # --------------------------------------------------------------------------
  build-and-preview:
    name: Package & Preview
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const body = `#### S3 Deployment Preview \`Success\`

            정적 파일 준비가 완료되었습니다.
            \`main\` 브랜치 머지 시 S3 버킷으로 자동 배포됩니다.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: site-build
          path: ${{ env.BUILD_DIR }}
          retention-days: 5

  # --------------------------------------------------------------------------
  # 2) main 에 push 됐을 때만 실제 버킷에 반영한다.
  # --------------------------------------------------------------------------
  deploy:
    name: Deploy to S3
    needs: build-and-preview
    # 배포는 저장소 변수 DEPLOY_ENABLED 가 'true' 일 때만 돈다.
    # 값이 없으면 이 job 은 실패가 아니라 '건너뜀'으로 처리된다.
    # (secrets 는 job 레벨 if 에서 쓸 수 없어 vars 로 게이트한다)
    if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: site-build
          path: ${{ env.BUILD_DIR }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # --delete 로 버킷을 site/ 와 정확히 일치시킨다.
      # 저장소에서 지운 파일이 버킷에 남지 않는다.
      - name: Sync files to S3
        run: |
          aws s3 sync "${BUILD_DIR}" "s3://${S3_BUCKET_NAME}" --delete

      # CloudFront 를 쓰는 경우 캐시 무효화 (필요 시 주석 해제)
      # - name: Invalidate CloudFront cache
      #   run: |
      #     aws cloudfront create-invalidation \
      #       --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
      #       --paths "/*"
