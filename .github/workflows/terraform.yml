# 테라폼 설정을 검사하고 인프라에 반영한다.
#
#   check  자격증명 없이 도는 검사(fmt · validate). 항상 실행된다.
#   plan   AWS 자격증명과 state 버킷이 필요하다. PR 에 결과를 코멘트한다.
#   apply  main 에 push 됐을 때만.
#
# plan 과 apply 는 저장소 변수 DEPLOY_ENABLED 가 'true' 일 때만 돈다.
# 시크릿을 설정하지 않은 저장소에서 자격증명 단계가 실패하는 것을 막기 위해서다.

name: Terraform

# ----------------------------------------------------------------------------
# 트리거
# ----------------------------------------------------------------------------
on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

# ----------------------------------------------------------------------------
# 공통 설정
# ----------------------------------------------------------------------------
env:
  TF_VERSION: "1.16.2"

  # SSH 허용 대역은 저장소에 두지 않고 Secret 으로 주입한다.
  # 예) ["203.0.113.10/32"]  (JSON 배열 형식이어야 한다)
  TF_VAR_ssh_allowed_cidrs: ${{ secrets['TF_VAR_SSH_ALLOWED_CIDRS'] }}

  WORKING_DIR: terraform/projects
  AWS_REGION: sa-east-1

# 동시에 두 개의 apply 가 돌면 state 락이 충돌하므로 직렬화
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  # --------------------------------------------------------------------------
  # 1) 자격증명이 필요 없는 검사. 어떤 저장소에서도 그대로 돈다.
  # --------------------------------------------------------------------------
  check:
    name: fmt / validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt
        run: terraform fmt -check -recursive -diff ..

      # -backend=false 로 초기화하면 state 버킷에 접근하지 않는다.
      # 문법과 참조 검사에는 backend 가 필요 없다.
      - name: Terraform init (backend 없이)
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate -no-color

  # --------------------------------------------------------------------------
  # 2) 실제 인프라를 읽어 변경 계획을 만든다. 자격증명과 state 버킷이 필요하다.
  # --------------------------------------------------------------------------
  plan:
    name: plan
    needs: check
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # backend 가 부분 설정이라 버킷/리전을 여기서 주입한다.
      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform plan
        id: plan
        run: terraform plan -input=false -no-color -out=tfplan
        continue-on-error: true

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}
        with:
          script: |
            const plan = (process.env.PLAN || '').slice(0, 60000)
            const body = `#### Terraform plan \`${{ steps.plan.outcome }}\`

            <details><summary>plan 결과 펼치기</summary>

            \`\`\`terraform
            ${plan}
            \`\`\`

            </details>`
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            })

      - name: Fail if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Upload plan artifact
        uses: actions/upload-artifact@v7
        with:
          name: tfplan
          path: ${{ env.WORKING_DIR }}/tfplan
          retention-days: 5

  # --------------------------------------------------------------------------
  # 3) main 에 push 됐을 때만 실제 인프라에 반영한다.
  # --------------------------------------------------------------------------
  apply:
    name: apply
    needs: plan
    if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve -no-color
