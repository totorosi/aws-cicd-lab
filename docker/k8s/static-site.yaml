# EKS 에 정적 사이트를 올리는 구성.
#
# 이미지 주소는 __IMAGE__ 자리표시자로 두고 배포할 때 치환한다.
# 매니페스트에 커밋 SHA 태그를 박아 커밋하면 배포할 때마다 이 파일이 바뀌어
# 변경 이력이 이미지 태그로 뒤덮인다.
#
# 앞의 네 방식과 다른 점: 어느 서버에 올릴지를 여기서 정하지 않는다.
# "이런 파드가 2개 떠 있어야 한다" 는 상태만 적고 배치는 클러스터가 정한다.
---
apiVersion: v1
kind: Namespace
metadata:
  name: static-site
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: static-site
  namespace: static-site
  labels:
    app: static-site
spec:
  replicas: 2
  selector:
    matchLabels:
      app: static-site
  template:
    metadata:
      labels:
        app: static-site
    spec:
      affinity:
        podAntiAffinity:
          # 노드가 2대뿐이라 required 로 걸면 노드 하나가 빠졌을 때
          # 남은 파드가 영원히 Pending 에 남는다. preferred 로 두어
          # 가능하면 나눠 띄우되, 안 되면 같은 노드에라도 뜨게 한다.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: static-site
      containers:
        - name: nginx
          image: __IMAGE__
          # 태그가 커밋 SHA 라 같은 태그가 다른 내용으로 재사용되지 않는다.
          # 그래서 Always 로 매번 확인할 필요가 없다.
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 80

          # readiness 가 통과해야 Service 의 엔드포인트에 등록된다.
          # 이게 없으면 nginx 가 뜨기도 전에 트래픽이 들어온다.
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20

          # t3.medium 2대에 올리는 실습 구성이라 넉넉히 잡지 않는다.
          # requests 가 없으면 스케줄러가 노드 여유를 판단할 근거가 없다.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: static-site
  namespace: static-site
spec:
  # ClusterIP 다. LoadBalancer 로 바꾸면 쿠버네티스가 ELB 를 만드는데,
  # 그 ELB 는 terraform state 밖에 있다. 지우지 않고 terraform destroy 를 하면
  # ENI 가 남아 VPC 삭제가 멈춘다. 바꾸려면 그 점을 알고 바꿔야 한다.
  type: ClusterIP
  selector:
    app: static-site
  ports:
    - name: http
      port: 80
      targetPort: http
