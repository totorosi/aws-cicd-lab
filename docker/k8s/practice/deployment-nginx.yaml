# 연습용. 배포 파이프라인과 무관하게 kubectl 로 직접 올리고 지운다.
#
#   kubectl apply -f docker/k8s/deployment-nginx.yaml
#   kubectl -n nginx-lab get pods -o wide
#   kubectl -n nginx-lab port-forward svc/nginx 8080:80
#   kubectl delete -f docker/k8s/deployment-nginx.yaml
---
apiVersion: v1
kind: Namespace
metadata:
  name: nginx-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: nginx-lab
spec:
  replicas: 2
  selector:
    # template 의 labels 와 어긋나면 apply 는 되는데 파드가 안 뜬다.
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.31.3-alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: nginx-lab
spec:
  type: ClusterIP
  selector:
    app: nginx
  ports:
    - name: tcp
      port: 80
      targetPort: 80
