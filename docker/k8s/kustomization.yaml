# ArgoCD 진입점. static-site.yaml 을 가져와 이미지만 덮어쓴다.
# ArgoCD 를 붙이기 전까지는 쓰이지 않는다. 그때 워크플로가 newName / newTag 를 갱신한다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # deployment-nginx.yaml 은 연습용이라 넣지 않는다.
  - static-site.yaml

images:
  - name: __IMAGE__
    newName: ACCOUNT_ID.dkr.ecr.sa-east-1.amazonaws.com/nginx
    newTag: latest
