# ArgoCD 진입점. web.yaml 을 가져와 이미지만 덮어쓴다.
# ArgoCD 를 붙이기 전까지는 쓰이지 않는다. 그때 워크플로가 newName / newTag 를 갱신한다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # deployment-nginx.yaml 은 연습용이라 넣지 않는다.
  - web.yaml

images:
  - name: __IMAGE__
    newName: 925047940866.dkr.ecr.sa-east-1.amazonaws.com/nginx
    newTag: 818dac6824cdfe8fd7470c8e40fe6cd3886b52e3
