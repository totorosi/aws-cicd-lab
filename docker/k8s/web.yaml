# 정적 사이트. __IMAGE__ 는 배포할 때 치환한다.
---
apiVersion: v1
kind: Namespace
metadata:
  name: web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: __IMAGE__
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: web
spec:
  # Ingress 가 ALB 를 만들므로 Service 는 ClusterIP 로 둔다.
  # LoadBalancer 로 바꾸면 ALB 와 별개로 ELB 가 하나 더 생긴다.
  type: ClusterIP
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: web
  annotations:
    # 인터넷에서 닿는 ALB 를 만든다. internal 로 두면 VPC 안에서만 닿는다.
    alb.ingress.kubernetes.io/scheme: internet-facing
    # 파드 IP 로 직접 보낸다. instance 로 두면 NodePort 를 거친다.
    alb.ingress.kubernetes.io/target-type: ip
spec:
  # AWS Load Balancer Controller 가 이 클래스를 보고 ALB 를 만든다.
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
