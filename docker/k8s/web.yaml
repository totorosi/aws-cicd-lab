# 정적 사이트. __IMAGE__ 는 배포할 때 치환한다.
---
apiVersion: v1
kind: Namespace
metadata:
  name: web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: web
spec:
  replicas: 2

  # 새 파드가 뜬 뒤에 옛 파드를 내린다. maxUnavailable: 0 이라 배포 중에도
  # 받을 수 있는 파드 수가 줄지 않는다.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: __IMAGE__
          ports:
            - name: http
              containerPort: 80
          # readiness: 트래픽을 받을 준비가 됐는가. 실패하면 Service 에서 뺀다.
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5

          # liveness: 살아있는가. 실패하면 컨테이너를 재시작한다.
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: web
spec:
  # Ingress 가 ALB 를 만들므로 Service 는 ClusterIP 로 둔다.
  # LoadBalancer 로 바꾸면 ALB 와 별개로 ELB 가 하나 더 생긴다.
  type: ClusterIP
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: web
  annotations:
    # 인터넷에서 닿는 ALB 를 만든다. internal 로 두면 VPC 안에서만 닿는다.
    alb.ingress.kubernetes.io/scheme: internet-facing
    # 파드 IP 로 직접 보낸다. instance 로 두면 NodePort 를 거친다.
    alb.ingress.kubernetes.io/target-type: ip
spec:
  # AWS Load Balancer Controller 가 이 클래스를 보고 ALB 를 만든다.
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
